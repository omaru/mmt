server:
  port: 8081

jwt:
  private:
    key: classpath:keys/jwt.private.pem
  public:
    key: classpath:keys/jwt.public.pem

service:
  user: mmt
  password: mmt

spring:
  datasource:
    url: jdbc:h2:mem:mmt
    driver-class-name: org.h2.Driver
    username: mmt
    password: mmt
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true
  flyway:
    locations: classpath:db/migrations
    baseline-on-migrate: true
    validate-on-migrate: true
